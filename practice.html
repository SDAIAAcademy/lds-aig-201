<section>
<h2>اليوم 1: من المبادئ إلى السجل</h2>
<ol>
<li><p>في دليل إحدى البلديات: «يرسل مالك النظام نموذج التغيير إلى مكتب الحوكمة، فيراجعه المكتب خلال خمسة أيام ويرد عليه كتابةً.» ما هذه العبارة؟</p><ul><li><b>أ.</b> ضابط، لأن فيها مالكًا ومهلة محددة للرد</li><li><b>ب.</b> إجراء، لأنها تصف خطوات طلب ومن ينفذ كل خطوة</li><li><b>ج.</b> معيار، لأنها تحدد مهلة خمسة أيام يمكن قياسها</li><li><b>د.</b> سياسة، لأنها مكتوبة في دليل رسمي ملزم للجميع</li></ul></li>
<li><p>يقترح مستشار على بلدية أن تعتمد إطار NIST كاملًا «بدل الانشغال بالمبادئ الوطنية، فهو أشمل». ما الرد الأدق؟</p><ul><li><b>أ.</b> نوافق، لأن الإطار الأشمل يغطي المبادئ الوطنية ضمنًا</li><li><b>ب.</b> نرفض، لأن أي إطار أجنبي يتعارض مع المرجع الوطني</li><li><b>ج.</b> نعتمده، فيصبح لدينا ضوابط قابلة للتشغيل فورًا</li><li><b>د.</b> نبني على المبادئ الوطنية، ونستعين بالإطار سندًا</li></ul></li>
<li><p>جددت بلدية ترخيص نظام إدارة المستودعات، وفي التجديد خاصية جديدة «توقع الطلب على المخزون» مفعّلة افتراضيًا، يعتمد عليها مدير المستودعات في أوامر الشراء. ماذا يفعل مكتب الحوكمة؟</p><ul><li><b>أ.</b> يسجلها نظامًا مستقلًا في السجل، ومالكها مدير المستودعات الذي يقرر بها</li><li><b>ب.</b> لا يسجلها، فالمورد هو المسؤول عن خصائص منتجه المشترى</li><li><b>ج.</b> يضيفها ملاحظةً في صف عقد النظام، لأن العقد واحد</li><li><b>د.</b> يسجلها ومالكها مدير تقنية المعلومات، فهو من يشغّل المنصة</li></ul></li>
<li><p>موظفة في بلدية تدفع اشتراكًا شهريًا في أداة كتابة بالذكاء الاصطناعي، وتستخدمها من حاسبها المحمول الشخصي على شبكة منزلها، ثم تطالب الجهة بالمبلغ. أين تظهر؟</p><ul><li><b>أ.</b> في ملخص الشبكة، لأن الأداة تتصل بخدمة خارجية دائمًا</li><li><b>ب.</b> في سجل المشتريات، لأن الجهة دفعت ثمن الاشتراك</li><li><b>ج.</b> في مطالبات المصروفات، فقد استردت قيمة الاشتراك</li><li><b>د.</b> لن تظهر في أي سجل، فلا يُكتشف إلا بالمقابلة</li></ul></li>
<li><p>في وثائق مستشفى: «لا يقل استدعاء نموذج كشف الحالات الحرجة عن 0.90 في كل فئة عمرية.» ما طبقة هذه العبارة؟</p><ul><li><b>أ.</b> ضابط، لأنها تذكر رقمًا يمكن اختباره</li><li><b>ب.</b> معيار، لأنها تحدد مستوى قابلًا للقياس</li><li><b>ج.</b> سياسة، لأنها قاعدة ملزمة لكل النماذج في المستشفى</li><li><b>د.</b> دليل، لأنها نتيجة قياس سابق للنموذج</li></ul></li>
<li><p>أي صياغة تجعل الضابط قابلًا للتشغيل والتدقيق في بلدية؟</p><ul><li><b>أ.</b> كل ربع سنة يقارن محلل الجودة الرفض بين الأحياء ويرفع ما فوق 5 نقاط</li><li><b>ب.</b> تراجع البلدية نتائج نظام الأهلية بانتظام لضمان عدالتها</li><li><b>ج.</b> يلتزم كل الموظفين بالإبلاغ فورًا عن أي نتيجة غير عادلة يلاحظونها في عملهم</li><li><b>د.</b> تعتمد البلدية إطارًا دوليًا معترفًا به لإدارة عدالة الأنظمة</li></ul></li>
<li><p>جهة حكومية تريد أن تستشهد بضوابطها أمام شريك دولي. ما الدور الأنسب لإطار NIST لإدارة مخاطر الذكاء الاصطناعي عندها؟</p><ul><li><b>أ.</b> يحل محل المبادئ الوطنية لأنه أوسع انتشارًا وأكثر تفصيلًا</li><li><b>ب.</b> يرتب الضوابط ولغتها، والمرجع الملزم يبقى وطنيًا</li><li><b>ج.</b> يُطبق فقط إذا طلبه الشريك في العقد</li><li><b>د.</b> يغني عن كتابة ضوابط لأن وظائفه تحددها</li></ul></li>
<li><p>في أي وظيفة من وظائف إطار NIST يقع ضابط «يؤكد كل مالك نظام بيانات نظامه في السجل كل ستة أشهر»؟</p><ul><li><b>أ.</b> MEASURE، لأنه يقيس اكتمال السجل ودقة بياناته</li><li><b>ب.</b> MAP، لأنه يحدد سياق كل نظام ومستخدميه</li><li><b>ج.</b> MANAGE، لأنه يعالج خطر السجل الناقص</li><li><b>د.</b> GOVERN، لأنه يثبت الأدوار والمساءلة</li></ul></li>
<li><p>طلب مدقق دليلًا على ضابط «مراجعة شهرية لعينة من إجابات روبوت المحادثة». أي ما يلي دليل كافٍ؟</p><ul><li><b>أ.</b> رسالة بريد من المالك يقول فيها إن المراجعات تمت</li><li><b>ب.</b> سجل المراجعة الشهري بالتاريخ والعينة والنتيجة ومن راجع</li><li><b>ج.</b> عرض تقديمي يشرح منهجية المراجعة الشهرية المعتمدة وأهدافها</li><li><b>د.</b> قائمة التحقق المعتمدة التي تُستخدم في المراجعة</li></ul></li>
<li><p>أي هذه يدخل سجل أنظمة الذكاء الاصطناعي في جامعة؟</p><ul><li><b>أ.</b> نظام يرسل تنبيهًا آليًا إذا تجاوز غياب الطالب 20%</li><li><b>ب.</b> لوحة مؤشرات تحسب نسب النجاح بصيغ ثابتة</li><li><b>ج.</b> خاصية في نظام القبول ترتب المتقدمين بنموذج مدرَّب</li><li><b>د.</b> بوابات دخول «ذكية» تفتح بالبطاقة الجامعية</li></ul></li>
<li><p>نظام لتوقع أعطال المضخات تشغّله تقنية المعلومات، ويقرر به مدير الصيانة متى يرسل الفرق. من مالكه في السجل؟</p><ul><li><b>أ.</b> مدير تقنية المعلومات، لأنه يشغّل الخادم</li><li><b>ب.</b> مدير الصيانة، لأنه يقرر بمخرجات النظام</li><li><b>ج.</b> المورد، لأنه بنى النموذج</li><li><b>د.</b> لجنة الحوكمة، لأنها توافق على الأنظمة</li></ul></li>
<li><p>تريد هيئة أن تكتشف خصائص الذكاء الاصطناعي التي وصلت مع تجديد تراخيص برمجياتها هذا العام. أين تبحث أولًا؟</p><ul><li><b>أ.</b> في ملخص الشبكة، لأنه يُظهر كل خدمة تتصل بها الأجهزة</li><li><b>ب.</b> في مطالبات المصروفات، لأن الموظفين يدفعون الترقيات</li><li><b>ج.</b> في المقابلات، لأن كل إدارة تعرف ما في برمجياتها</li><li><b>د.</b> في سجل المشتريات، لأن الخاصية تصل مع التجديد وملحقه</li></ul></li>
<li><p>وجدت في ملخص الشبكة أن إدارة الشؤون القانونية رفعت 400 ميغابايت إلى خدمة توليدية عامة. ما الخطوة التالية الأصح؟</p><ul><li><b>أ.</b> تسجل الاستخدام بحالة يُؤكَّد، وتسأل الإدارة عن الغرض والمالك</li><li><b>ب.</b> تسجله نظامًا عالي المخاطر لأن بيانات قانونية خرجت</li><li><b>ج.</b> تحجب النطاق فورًا وتحيل الموظفين المعنيين إلى التحقيق الإداري</li><li><b>د.</b> تتجاهله لأن الشبكة لا تثبت أن الأداة نظام ذكاء اصطناعي</li></ul></li>
<li><p>أي محفّز يُبقي سجل الأنظمة محدثًا دون انتظار حصر سنوي؟</p><ul><li><b>أ.</b> تذكير عام للموظفين في نشرة الجهة الداخلية مرة كل سنة</li><li><b>ب.</b> سؤال إلزامي في كل طلب شراء عن وجود ذكاء اصطناعي فيه</li><li><b>ج.</b> تدقيق خارجي شامل لكل أنظمة الجهة مرة كل ثلاث سنوات</li><li><b>د.</b> منح الإدارات حرية إضافة أنظمتها متى شاءت</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: المخاطر والمساءلة</h2>
<ol>
<li><p>في حصر بلدية، وصفت إدارتان «مساعد الرد على الاستفسارات» باسمين مختلفين. هو منصة واحدة بعقد واحد وغرض واحد، ويقرر مدير خدمة السكان بمخرجاته. كيف يُسجَّل؟</p><ul><li><b>أ.</b> سطران، لأن لكل إدارة اسمًا ومستخدمين مختلفين عن الأخرى</li><li><b>ب.</b> سطر واحد مالكه تقنية المعلومات لأنها تشغّله</li><li><b>ج.</b> لا يُسجَّل حتى تتفق الإدارتان على اسم واحد له</li><li><b>د.</b> سطر واحد مالكه مدير خدمة السكان، والإدارتان مستخدمتان</li></ul></li>
<li><p>في مستشفى افتراضي، نظام يقترح ترتيب قائمة انتظار العمليات غير العاجلة، ويعتمده منسق في كل حالة. التأخير قد يضر بصحة المريض. الدرجات: الأثر 3، والاستقلالية 2، والنطاق 1، والتراجع 2، والبيانات 3. المجموع 11.</p><ul><li><b>أ.</b> محدودة، لأن المجموع 11 دون عتبة القاعدة 3</li><li><b>ب.</b> محدودة، لأن المنسق يعتمد الترتيب في كل حالة</li><li><b>ج.</b> عالية، لأن القاعدة 2 تسبق المجموع: أثر 3 مع استقلالية 2</li><li><b>د.</b> غير مقبولة، لأنه يرتب المرضى بحسب حالتهم الصحية</li></ul></li>
<li><p>نظام في جامعة افتراضية يقترح قبول طلبات السكن ويعتمدها موظف: الأثر 2، والاستقلالية 2، والنطاق 1، والتراجع 2، والبيانات 2 (المجموع 9، محدودة). صار يقبل ويرفض آليًا دون مراجعة. ما المستوى بسلم الهيئة؟</p><ul><li><b>أ.</b> عالية، لأن القرار صار يصدر دون مراجعة بشرية</li><li><b>ب.</b> محدودة، لأن الاستقلالية صارت 3 والأثر بقي 2 فقط</li><li><b>ج.</b> عالية، لأن المجموع بعد التعديل بلغ عتبة القاعدة 3 وهي 12</li><li><b>د.</b> بسيطة، لأن الطالب المرفوض يستطيع أن يعيد طلبه</li></ul></li>
<li><p>في مصفوفة بلدية افتراضية، للقرار «اعتماد نموذج تقييم الأثر الذي تستخدمه الإدارات»: اللجنة A، ومكتب الحوكمة A، وتقنية المعلومات R، والقانونية C. ما العيب الأهم؟</p><ul><li><b>أ.</b> تقنية المعلومات يجب أن تكون A لأنها تنفذ النموذج</li><li><b>ب.</b> لا عيب، فاشتراك جهتين في المساءلة يقوّي القرار</li><li><b>ج.</b> ينقصه أن تكون المراجعة الداخلية C في القرار</li><li><b>د.</b> للقرار مساءلان، فلا أحد يملكه وحده ويُسأل عنه</li></ul></li>
<li><p>في بلدية افتراضية، تطلب مديرة المراجعة الداخلية أن توقّع على موافقة نشر كل نظام عالي المخاطر «لضمان الجودة». ما الإسناد الصحيح لها في مصفوفة قرار النشر؟</p><ul><li><b>أ.</b> A، لأن توقيعها يضمن جودة القرار قبل النشر</li><li><b>ب.</b> I، لأنها تراجع القرار لاحقًا باستقلال عنه</li><li><b>ج.</b> C، لأن رأيها المسبق يمنع الأخطاء قبل وقوعها</li><li><b>د.</b> R، لأنها تتحقق من اكتمال الأدلة قبل النشر</li></ul></li>
<li><p>بسلم الهيئة: نظام يقترح على موظف الضمان أي الأسر تُزار أولًا للتحقق من الاستحقاق، ويعتمده الموظف في كل حالة. الأثر 3، والاستقلالية 2، والنطاق 2، والتراجع 2، والبيانات 2. ما المستوى؟</p><ul><li><b>أ.</b> محدودة، لأن المجموع 11 أقل من عتبة القاعدة 3 وهي 12</li><li><b>ب.</b> محدودة، لأن الموظف يعتمد كل زيارة بنفسه</li><li><b>ج.</b> عالية، لأن الأثر 3 والاستقلالية 2 بالقاعدة 2</li><li><b>د.</b> غير مقبولة، لأنه يرتب الأسر بحسب ظروفها</li></ul></li>
<li><p>نظام يصنف تذاكر الدعم الفني الداخلية ويحوّلها آليًا دون مراجعة. الأثر 1، والاستقلالية 3، والنطاق 1، والتراجع 1، والبيانات 1. ما المستوى بسلم الهيئة؟</p><ul><li><b>أ.</b> عالية، لأنه يتصرف ويحوّل التذاكر دون أي مراجعة بشرية</li><li><b>ب.</b> محدودة، لأن الاستقلالية في أعلى درجاتها</li><li><b>ج.</b> بسيطة أو منعدمة، لأن مجموعه 7 وأثره 1</li><li><b>د.</b> يُصنف بعد أن يعمل سنة ونعرف أخطاءه</li></ul></li>
<li><p>أداة تلخيص معتمدة للأخبار العامة صُنفت بسيطة. اكتشف الأمن السيبراني أن موظفًا لصق فيها محضرًا مصنفًا «سري». ما المعالجة الصحيحة؟</p><ul><li><b>أ.</b> معالجة المخالفة بالسياسة، وبقاء مستوى الأداة</li><li><b>ب.</b> رفع مستوى الأداة إلى عالية لأن بيانات سرية دخلتها</li><li><b>ج.</b> إيقاف الأداة لكل الموظفين حتى تنتهي مراجعتها كاملة</li><li><b>د.</b> تجاهل الحادث لأن الأداة معتمدة ومستواها بسيط</li></ul></li>
<li><p>نظام في جامعة يقترح إنذارات الغياب ويعتمدها المرشد (محدودة). عُدّل فصار الإنذار الثالث يحرم الطالب من دخول الاختبار آليًا. أي عامل تغير، وما أثره؟</p><ul><li><b>أ.</b> الأثر صار 3 والاستقلالية 3، فيصبح عاليًا</li><li><b>ب.</b> النطاق فقط، لأن عدد الطلاب المتأثرين زاد</li><li><b>ج.</b> البيانات، لأن سجل الحضور صار أكثر حساسية</li><li><b>د.</b> لا شيء، فالإنذار كان موجودًا قبل التعديل</li></ul></li>
<li><p>قال مالك نظام: «النظام يقترح فقط، والموظف يقرر». أي واقعة تحسم درجة الاستقلالية؟</p><ul><li><b>أ.</b> نص سياسة الإدارة الذي يقول إن القرار النهائي للموظف</li><li><b>ب.</b> عدد الموظفين الذين تدربوا على استخدام النظام</li><li><b>ج.</b> نسبة الاقتراحات التي عدّلها الموظفون في الواقع</li><li><b>د.</b> اسم الموظف الذي يوقّع على كل قرار يصدر</li></ul></li>
<li><p>في مصفوفة جهة، لقرار «اعتماد نموذج تقرير المراقبة الربعي»: مكتب الحوكمة A، والمخاطر والالتزام A، ومالك النظام R. ما الإصلاح؟</p><ul><li><b>أ.</b> إبقاء الحرفين لأن القرار يحتاج خبرة الجهتين معًا</li><li><b>ب.</b> جعل مالك النظام A لأنه الذي يكتب التقرير</li><li><b>ج.</b> نقل القرار إلى اللجنة لأنها أعلى من الجهتين</li><li><b>د.</b> إبقاء A واحد لأن الصلاحية لدور واحد، والآخر C</li></ul></li>
<li><p>في جهة تجتمع لجنتها شهريًا، بدأ نظام لترتيب طلبات الإسكان يستبعد فئة من المتقدمين خطأً. من الأنسب أن يكون مساءلًا عن الإيقاف المؤقت؟</p><ul><li><b>أ.</b> مالك النظام، لأنه يملك الصلاحية ويرى الضرر أولًا</li><li><b>ب.</b> لجنة الحوكمة، لأنها وافقت على نشر النظام</li><li><b>ج.</b> المراجعة الداخلية، لأنها مستقلة عن الإدارة المشغلة</li><li><b>د.</b> تقنية المعلومات، لأنها التي تنفذ الإيقاف التقني</li></ul></li>
<li><p>بلدية تستخدم نموذجًا لغويًا طوّرته شركة وتتيحه منصة سحابية، لتجيب السكان عن الرسوم. نشر النظام إجابة خاطئة. من يُسأل أمام السكان؟</p><ul><li><b>أ.</b> الشركة المطوّرة، لأنها بنت النموذج ودربته على البيانات</li><li><b>ب.</b> المنصة السحابية، لأنها تستضيف النموذج وتتيحه</li><li><b>ج.</b> البلدية، لأنها الجهة الناشرة التي قررت استخدامه</li><li><b>د.</b> الموظف الذي يراقب النظام، لأنه رأى الخطأ أولًا</li></ul></li>
<li><p>أي وصف يضع مكتب حوكمة الذكاء الاصطناعي في موضعه من خطوط الدفاع الثلاثة؟</p><ul><li><b>أ.</b> الخط الأول، لأنه يدير السجل والاستقبال وتحديد المستوى يوميًا</li><li><b>ب.</b> الخط الثالث، لأنه يراجع الأنظمة قبل نشرها</li><li><b>ج.</b> خارج الخطوط الثلاثة، لأنه يتبع رئيس اللجنة مباشرة</li><li><b>د.</b> الخط الثاني، لأنه يضع المعايير ويتابع دون أن يملك أنظمة</li></ul></li>
<li><p>أضافت جهة ستة أدوار «يُستشار» إلى كل قرار نشر نظام محدود المخاطر، فصار متوسط الموافقة سبعة أسابيع. ما الإصلاح الأنسب؟</p><ul><li><b>أ.</b> إبقاء من يضيف رأيه شيئًا، وتحويل الباقين إلى الإبلاغ</li><li><b>ب.</b> إلغاء الاستشارة كلها لتسريع قرارات الأنظمة المحدودة المخاطر</li><li><b>ج.</b> رفع كل القرارات المحدودة إلى اللجنة لتحسمها</li><li><b>د.</b> إضافة مساءل ثانٍ يتابع تأخر الاستشارات</li></ul></li>
</ol>

<section>
<h2>اليوم 3: السياسات وبوابات دورة الحياة</h2>
<ol>
<li><p>في بلدية افتراضية، صُنّف نظام يقترح أولوية صيانة الطرق «محدودة». أي مبرر من سطر واحد هو الأصلح للسجل؟</p><ul><li><b>أ.</b> «محدودة: نظام مهم لكن مخاطره معقولة في رأي الفريق»</li><li><b>ب.</b> «محدودة: مجموع الدرجات 10 بحسب السلم المعتمد»</li><li><b>ج.</b> «محدودة: مهندس يعتمد كل أولوية، والتأخير يُستدرك»</li><li><b>د.</b> «محدودة: المورد معروف وأنظمته منتشرة في البلديات»</li></ul></li>
<li><p>موظف في بلدية افتراضية يريد لصق شكوى أحد السكان، وفيها اسمه ورقم جواله، في مساعد توليدي عام ليصوغ ردًا. سياسة البلدية تتبع المبادئ الوطنية. ما الحكم؟</p><ul><li><b>أ.</b> محظور، لأن الشكوى فيها بيانات شخصية والأداة توليدية</li><li><b>ب.</b> مسموح بشروط، إن راجع الموظف الرد قبل إرساله إلى صاحب الشكوى</li><li><b>ج.</b> مقيد، يجوز بموافقة مدير إدارة خدمة السكان</li><li><b>د.</b> مسموح، لأن الشكوى جاءت أصلًا من الجمهور</li></ul></li>
<li><p>سياسة بلدية افتراضية فيها بندان: (1) لا تُدخل بيانات «مقيد» فأعلى في أي أداة ذكاء اصطناعي توليدي. (2) يجوز استخدام الأدوات التوليدية مع بيانات «عام» بشرط مراجعة الناتج. تريد لجنة المشتريات أن يرتب نموذج تعلم آلي بنته البلدية، وليس توليديًا، عروض الموردين في منافسة. ما الحكم بهذه السياسة؟</p><ul><li><b>أ.</b> مسموح، لأن النموذج غير توليدي فلا ينطبق عليه البند 1</li><li><b>ب.</b> محظور، لأن عروض الموردين مقيدة والبند 1 يمنعها</li><li><b>ج.</b> فجوة، لأن البندين لا يحكمان نموذجًا غير توليدي</li><li><b>د.</b> مسموح بشروط، لأن البند 2 يكفي إن راجعت اللجنة الترتيب</li></ul></li>
<li><p>مواصفات بوابات مستشفى افتراضي تشترط موافقة لجنة الحوكمة في بوابة النشر لكل نظام، بما فيها البسيطة كجدولة غرف الاجتماعات. ما المشكلة الأهم؟</p><ul><li><b>أ.</b> لا مشكلة، لأن موافقة اللجنة على كل نظام أكثر أمانًا</li><li><b>ب.</b> المشكلة في الموافق، لأنه يجب أن يكون المراجعة الداخلية</li><li><b>ج.</b> المشكلة في الاستقبال، لأن البسيطة لا تحتاج حتى إليه</li><li><b>د.</b> غياب التناسب، لأن اللجنة تزدحم فتصير موافقتها شكلية</li></ul></li>
<li><p>في مستشفى افتراضي، أزمنة ثمانية قرارات بوابات بالأيام: 2، 3، 3، 4، 5، 6، 7، 55. يطلب رئيس اللجنة رقمًا واحدًا لزمن البوابة المعتاد. ما الأصح؟</p><ul><li><b>أ.</b> المتوسط، نحو 10.6 أيام، لأنه يشمل كل القرارات الثمانية</li><li><b>ب.</b> الوسيط، 4.5 أيام، مع ذكر القرار الذي أخذ 55 يومًا وسببه</li><li><b>ج.</b> متوسط القرارات السبعة بعد حذف القرار الطويل</li><li><b>د.</b> أطول زمن، 55 يومًا، لأنه يبين أسوأ ما يحدث</li></ul></li>
<li><p>موظف في جامعة يريد أن يلخص بمساعد توليدي عام محضر مجلس قسم مصنفًا «مقيد». سياسة الجامعة تتبع المبادئ الوطنية. ما الحكم؟</p><ul><li><b>أ.</b> مسموح بشروط، إن حذف الأسماء وراجع الملخص</li><li><b>ب.</b> محظور، لأن المحضر مقيد والأداة توليدية</li><li><b>ج.</b> مقيد، يجوز بموافقة رئيس القسم كتابيًا</li><li><b>د.</b> مسموح، لأن الملخص للاستخدام الداخلي فقط</li></ul></li>
<li><p>أي صياغة لبند وكلاء البرمجة تحسم حالة المطور دون أن يسأل أحدًا؟</p><ul><li><b>أ.</b> يستخدم المطورون وكلاء البرمجة بحذر ووفق أفضل الممارسات</li><li><b>ب.</b> يُسمح بوكلاء البرمجة في المشاريع التي يراها المدير مناسبة</li><li><b>ج.</b> يعمل الوكيل في فرع منفصل، ويراجع مطور كل دمج قبل تنفيذه</li><li><b>د.</b> تُراجع الحوكمة استخدام وكلاء البرمجة كل ستة أشهر بانتظام</li></ul></li>
<li><p>طلبت إدارة في هيئة استثناءً من البند المحظور «لا تصنيف اجتماعي للسكان» لتجربة مدتها شهر. ما الرد الصحيح؟</p><ul><li><b>أ.</b> يُرفض، فالسياسة تمنع المحظور منعًا مطلقًا</li><li><b>ب.</b> يُقبل لشهر واحد بعد موافقة اللجنة وتسجيله</li><li><b>ج.</b> يُقبل إن كانت التجربة على بيانات اصطناعية فقط</li><li><b>د.</b> يُحال إلى المراجعة الداخلية لتقرر بالاستقلال</li></ul></li>
<li><p>اختبرت جهة سياستها على عشر حالات، فوجدت أن أربعًا منها لا يحسمها بند، وكلها أدوات بناها الموظفون بأنفسهم. ما الإصلاح الأنسب؟</p><ul><li><b>أ.</b> أربعة بنود، بند لكل حالة كما وردت في الاختبار</li><li><b>ب.</b> ترك الحالات للاستثناءات لأنها قليلة ونادرة</li><li><b>ج.</b> تفسير بند المسموح بشروط ليشمل هذه الأدوات</li><li><b>د.</b> بند واحد لفئة الأدوات التي يبنيها الموظفون</li></ul></li>
<li><p>أي قسم مراجعة في سياسة الاستخدام المقبول يمكن التحقق من تطبيقه؟</p><ul><li><b>أ.</b> تُحدَّث السياسة كلما دعت الحاجة إلى ذلك</li><li><b>ب.</b> تُراجع في 31 مارس سنويًا، وعند صدور تنظيم وطني</li><li><b>ج.</b> تُراجع دوريًا بحسب تطور تقنيات الذكاء الاصطناعي</li><li><b>د.</b> تبقى سارية حتى تقرر الإدارة العليا تعديلها</li></ul></li>
<li><p>في مصفوفة جهة، مسؤول البيانات هو المساءل عن «الموافقة على مصادر البيانات». في مواصفات بواباتها، من يوافق على بوابة التصميم والبيانات لنظام محدود المخاطر؟</p><ul><li><b>أ.</b> لجنة الحوكمة، لأنها أعلى جهة في الجهة</li><li><b>ب.</b> مكتب الحوكمة، لأنه يدير البوابات كلها ويحفظ أدلتها</li><li><b>ج.</b> مالك النظام، لأنه يقدم أدلة البوابة</li><li><b>د.</b> مسؤول البيانات، لأنه المساءل عن القرار في المصفوفة</li></ul></li>
<li><p>نظام عالي المخاطر لترتيب طلبات الدعم السكني اجتاز بوابة النشر. أي تغيير يعيده إلى بوابة المراقبة وإعادة الموافقة قبل موعدها الربعي؟</p><ul><li><b>أ.</b> ربط النموذج ببيانات دخل الأسر من جهة أخرى</li><li><b>ب.</b> تغيير ألوان واجهة المستخدم بناءً على ملاحظات الموظفين</li><li><b>ج.</b> انتقال مالك النظام إلى إدارة أخرى داخل الجهة</li><li><b>د.</b> ارتفاع عدد الطلبات 5% عن الربع الماضي</li></ul></li>
<li><p>أي مواصفات لبوابة النشر تحقق التناسب في جهة لها أربعة مستويات؟</p><ul><li><b>أ.</b> اللجنة توافق على نشر كل نظام مهما كان مستواه</li><li><b>ب.</b> البسيط بالسجل، والمحدود بالمكتب، والعالي باللجنة</li><li><b>ج.</b> المالك يوافق على نشر كل نظام، عاليًا كان أو بسيطًا، لأنه أعلم به</li><li><b>د.</b> لا بوابة نشر للأنظمة المحدودة والبسيطة معًا</li></ul></li>
<li><p>ملف نظام عالي المخاطر عند بوابة النشر فيه تقرير اختبار موقّع وخطة مراقبة وإشعار المتأثرين، وتنقصه خطة الإيقاف. كتب المالك: «نرجو الاعتماد ونرسل الخطة لاحقًا». ما القرار؟</p><ul><li><b>أ.</b> عبور مشروط، وتُرسل الخطة خلال شهر من النشر</li><li><b>ب.</b> عبور، فالأدلة الأهم موجودة والخطة إجراء شكلي</li><li><b>ج.</b> تعليق حتى تكتمل خطة الإيقاف، والموافق اللجنة</li><li><b>د.</b> رفض نهائي، ويُعاد النظام إلى بوابة الاستقبال</li></ul></li>
<li><p>سجل استثناءات جهة فيه خمسة استثناءات مفتوحة، ثلاثة منها تجاوزت تاريخ انتهائها منذ أشهر. ماذا يدل عليه ذلك أولًا؟</p><ul><li><b>أ.</b> أن السياسة صارمة أكثر من اللازم وتحتاج تخفيفًا</li><li><b>ب.</b> أن أحدًا لا يتابع انتهاء الاستثناءات ويغلقها</li><li><b>ج.</b> أن الإدارات تلتزم بالسياسة لأنها تطلب الاستثناءات</li><li><b>د.</b> أن عدد الاستثناءات قليل فلا يحتاج إلى إجراء</li></ul></li>
</ol>
